name: hdx-oss

x-cbt-couchbase-env: &cbt-couchbase-env
  CBT_COUCHBASE_CONNSTR: couchbase://couchbase
  CBT_COUCHBASE_BUCKET: ${CBT_COUCHBASE_BUCKET:-otel}
  CBT_COUCHBASE_SCOPE: ${CBT_COUCHBASE_SCOPE:-default}
  CBT_COUCHBASE_ADMIN_USER: ${CBT_COUCHBASE_ADMIN_USER:?set CBT_COUCHBASE_ADMIN_USER in .env}
  CBT_COUCHBASE_ADMIN_PASSWORD: ${CBT_COUCHBASE_ADMIN_PASSWORD:?set CBT_COUCHBASE_ADMIN_PASSWORD in .env}
  CBT_COUCHBASE_QUERY_USER: ${CBT_COUCHBASE_QUERY_USER:?set CBT_COUCHBASE_QUERY_USER in .env}
  CBT_COUCHBASE_QUERY_PASSWORD: ${CBT_COUCHBASE_QUERY_PASSWORD:?set CBT_COUCHBASE_QUERY_PASSWORD in .env}
  CBT_COUCHBASE_INGEST_USER: ${CBT_COUCHBASE_INGEST_USER:?set CBT_COUCHBASE_INGEST_USER in .env}
  CBT_COUCHBASE_INGEST_PASSWORD: ${CBT_COUCHBASE_INGEST_PASSWORD:?set CBT_COUCHBASE_INGEST_PASSWORD in .env}
  CBT_COUCHBASE_MONITOR_USER: ${CBT_COUCHBASE_MONITOR_USER:-}
  CBT_COUCHBASE_MONITOR_PASSWORD: ${CBT_COUCHBASE_MONITOR_PASSWORD:-}
  CBT_COUCHBASE_RAM_MB: ${CBT_COUCHBASE_RAM_MB:-2048}
  CBT_COUCHBASE_INDEX_RAM_MB: ${CBT_COUCHBASE_INDEX_RAM_MB:-512}
  CBT_COUCHBASE_SEARCH_RAM_MB: ${CBT_COUCHBASE_SEARCH_RAM_MB:-512}
  # App metadata bucket (cbt_meta). Required since C1: teams, users, invites,
  # and sessions live there; couchbase-init creates the user.
  CBT_METADATA_BUCKET: ${CBT_METADATA_BUCKET:-cbt_meta}
  CBT_METADATA_USER: ${CBT_METADATA_USER:?set CBT_METADATA_USER in .env}
  CBT_METADATA_PASSWORD: ${CBT_METADATA_PASSWORD:?set CBT_METADATA_PASSWORD in .env}
  CBT_METADATA_RAM_MB: ${CBT_METADATA_RAM_MB:-256}

services:
  db:
    image: mongo:5.0.32-focal
    volumes:
      - .volumes/db:/data/db
    networks:
      - internal

  couchbase:
    image: ${COUCHBASE_IMAGE:?set COUCHBASE_IMAGE in .env}
    volumes:
      - .volumes/couchbase:/opt/couchbase/var
    ports:
      - '127.0.0.1:8091:8091'
      - '127.0.0.1:8092:8092'
      - '127.0.0.1:8093:8093'
      - '127.0.0.1:8094:8094'
      - '127.0.0.1:8095:8095'
      - '127.0.0.1:8096:8096'
      - '127.0.0.1:8097:8097'
      - '127.0.0.1:11210:11210'
    healthcheck:
      test:
        ['CMD', 'curl', '-fs', 'http://localhost:8091/ui/index.html']
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      - internal

  couchbase-init:
    image: ${CBT_IMAGE_REPO}/${CBT_INGEST_IMAGE_NAME:?set CBT_INGEST_IMAGE_NAME in .env}:${IMAGE_VERSION}
    environment:
      <<: *cbt-couchbase-env
    entrypoint: ['/bin/bash', '/docker/couchbase/init.sh']
    volumes:
      - ./docker/couchbase/init.sh:/docker/couchbase/init.sh:ro
    depends_on:
      couchbase:
        condition: service_healthy
    restart: 'no'
    networks:
      - internal

  ingest:
    image: ${CBT_IMAGE_REPO}/${CBT_INGEST_IMAGE_NAME}:${IMAGE_VERSION}
    environment:
      <<: *cbt-couchbase-env
      CBT_INGEST_TOKEN: ${CBT_INGEST_TOKEN:?set CBT_INGEST_TOKEN in .env}
      CBT_LOGS_TTL: ${CBT_LOGS_TTL:-720h}
      CBT_TRACES_TTL: ${CBT_TRACES_TTL:-720h}
      CBT_METRICS_TTL: ${CBT_METRICS_TTL:-720h}
      CBT_SESSIONS_TTL: ${CBT_SESSIONS_TTL:-720h}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4320/health',{headers:{Authorization:'Bearer '+process.env.CBT_INGEST_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      couchbase-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - internal

  otel-collector:
    image: ${CBT_IMAGE_REPO}/${NEXT_OTEL_COLLECTOR_IMAGE_NAME_DOCKERHUB}:${IMAGE_VERSION}
    environment:
      CBT_INGEST_ENDPOINT: http://ingest:4320
      CBT_INGEST_TOKEN: ${CBT_INGEST_TOKEN:?set CBT_INGEST_TOKEN in .env}
      CBT_API_KEY: ${CBT_API_KEY:?set CBT_API_KEY in .env}
      CBT_LOG_LEVEL: ${CBT_LOG_LEVEL}
      OPAMP_SERVER_URL: 'http://app:${CBT_OPAMP_PORT}'
    ports:
      - '13133:13133'
      - '24225:24225'
      - '4317:4317'
      - '4318:4318'
      - '8888:8888'
    restart: always
    networks:
      - internal
    depends_on:
      ingest:
        condition: service_healthy
      app:
        condition: service_started

  app:
    image: ${CBT_IMAGE_REPO}/${NEXT_IMAGE_NAME_DOCKERHUB}:${IMAGE_VERSION}
    ports:
      - ${CBT_API_PORT}:${CBT_API_PORT}
      - ${CBT_APP_PORT}:${CBT_APP_PORT}
    environment:
      FRONTEND_URL: ${CBT_APP_URL}:${CBT_APP_PORT}
      CBT_API_KEY: ${CBT_API_KEY:?set CBT_API_KEY in .env}
      CBT_API_PORT: ${CBT_API_PORT}
      CBT_APP_PORT: ${CBT_APP_PORT}
      CBT_APP_URL: ${CBT_APP_URL}
      CBT_LOG_LEVEL: ${CBT_LOG_LEVEL}
      MONGO_URI: 'mongodb://db:27017/hyperdx'
      CBT_COUCHBASE_CONNSTR: couchbase://couchbase
      CBT_METADATA_BUCKET: ${CBT_METADATA_BUCKET:-cbt_meta}
      CBT_METADATA_USER: ${CBT_METADATA_USER:?set CBT_METADATA_USER in .env}
      CBT_METADATA_PASSWORD: ${CBT_METADATA_PASSWORD:?set CBT_METADATA_PASSWORD in .env}
      SERVER_URL: http://127.0.0.1:${CBT_API_PORT}
      OPAMP_PORT: ${CBT_OPAMP_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      OTEL_SERVICE_NAME: 'hdx-oss-app'
      WEBHOOK_HOSTNAME_ALLOWLIST: ${WEBHOOK_HOSTNAME_ALLOWLIST:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      EXPRESS_SESSION_SECRET: ${EXPRESS_SESSION_SECRET:-}
      CBT_DEFAULT_SOURCES_PRESET: couchbase
      CBT_INGEST_ENDPOINT: http://ingest:4320
      CBT_INGEST_TOKEN: ${CBT_INGEST_TOKEN:?set CBT_INGEST_TOKEN in .env}
      DEFAULT_CONNECTIONS: >-
        [{"name":"Local Couchbase","kind":"couchbase","host":"couchbase://couchbase","username":"${CBT_COUCHBASE_QUERY_USER}","password":"${CBT_COUCHBASE_QUERY_PASSWORD}","monitorUsername":"${CBT_COUCHBASE_MONITOR_USER:-}","monitorPassword":"${CBT_COUCHBASE_MONITOR_PASSWORD:-}"}]
    networks:
      - internal
    depends_on:
      db:
        condition: service_started
      couchbase-init:
        condition: service_completed_successfully

networks:
  internal:
