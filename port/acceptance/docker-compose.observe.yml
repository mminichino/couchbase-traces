# Acceptance observe override: CoreDNS logger, statement capture, webhook receiver,
# and local build contexts so `up -d --build` works without pulling private GHCR images.
#
# Paths are relative to the project directory (docker-compose.yml), not this file.
# Used as: docker compose -p cbt-acceptance -f docker-compose.yml -f port/acceptance/docker-compose.observe.yml ...

services:
  dns:
    image: coredns/coredns:1.11.3
    command: ['-conf', '/Corefile']
    volumes:
      - ./port/acceptance/coredns/Corefile:/Corefile:ro
      - ./port/state/acceptance/evidence/coredns:/var/log/coredns
    networks:
      internal:
        ipv4_address: 172.28.0.53

  webhook:
    image: node:22-alpine
    working_dir: /app
    command: ['node', 'server.mjs']
    volumes:
      - ./port/acceptance/webhook-receiver:/app:ro
      - ./port/state/acceptance/evidence/webhooks:/data
    networks:
      - internal
    expose:
      - '8080'

  couchbase-init:
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    dns:
      - 172.28.0.53

  ingest:
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    dns:
      - 172.28.0.53

  otel-collector:
    build:
      context: .
      dockerfile: docker/otel-collector/Dockerfile
      target: prod
    dns:
      - 172.28.0.53

  app:
    build:
      context: .
      dockerfile: docker/hyperdx/Dockerfile
      target: prod
      additional_contexts:
        hyperdx: ./docker/hyperdx
        api: ./packages/api
        app: ./packages/app
      args:
        CODE_VERSION: acceptance
    environment:
      CBT_QUERY_CAPTURE_FILE: /capture/statements.ndjson
      WEBHOOK_HOSTNAME_ALLOWLIST: webhook
    volumes:
      - ./port/state/acceptance/evidence:/capture
    dns:
      - 172.28.0.53

  couchbase:
    dns:
      - 172.28.0.53

  db:
    dns:
      - 172.28.0.53

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16
