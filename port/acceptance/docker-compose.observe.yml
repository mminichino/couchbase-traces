# Acceptance observe override: CoreDNS logger, statement capture, webhook receiver,
# and local build contexts so `up -d --build` works without pulling private GHCR images.
#
# Paths are relative to the project directory (docker-compose.yml), not this file.
# Used as: docker compose -p cbt-acceptance -f docker-compose.yml -f port/acceptance/docker-compose.observe.yml ...

services:
  dns:
    image: coredns/coredns:1.11.3
    command: ['-conf', '/Corefile']
    volumes:
      - ./port/acceptance/coredns/Corefile:/Corefile:ro
      - ./port/state/acceptance/evidence/coredns:/var/log/coredns
    networks:
      internal:
        ipv4_address: 172.28.0.53

  webhook:
    image: node:22-alpine
    working_dir: /app
    command: ['node', 'server.mjs']
    volumes:
      - ./port/acceptance/webhook-receiver:/app:ro
      - ./port/state/acceptance/evidence/webhooks:/data
    networks:
      - internal
    expose:
      - '8080'

  couchbase-init:
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    dns:
      - 172.28.0.53

  ingest:
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    # Product /health requires auth; acceptance only needs process liveness.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4320/health').then(r=>process.exit(r.status===401||r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    dns:
      - 172.28.0.53

  otel-collector:
    build:
      context: .
      dockerfile: docker/otel-collector/Dockerfile
      target: prod
    # Replace published ports (+10000) so a developer stack can keep 4317/4318.
    ports: !override
      - '23133:13133'
      - '34225:24225'
      - '14317:4317'
      - '14318:4318'
      - '18888:8888'
    dns:
      - 172.28.0.53

  app:
    build:
      context: .
      dockerfile: docker/hyperdx/Dockerfile
      target: prod
      additional_contexts:
        hyperdx: ./docker/hyperdx
        api: ./packages/api
        app: ./packages/app
      args:
        CODE_VERSION: acceptance
    environment:
      CBT_QUERY_CAPTURE_FILE: /capture/statements.ndjson
      WEBHOOK_HOSTNAME_ALLOWLIST: webhook
    volumes:
      - ./port/state/acceptance/evidence:/capture
    dns:
      - 172.28.0.53

  couchbase:
    # Do not publish Couchbase ports to the host. Acceptance talks to
    # Couchbase only on the compose network; publishing would collide with
    # developer stacks (including ones that already bind 18091–18097).
    ports: !override []
    volumes: !override
      - ./.volumes/cbt-acceptance/couchbase:/opt/couchbase/var
    dns:
      - 172.28.0.53

  db:
    volumes: !override
      - ./.volumes/cbt-acceptance/db:/data/db
    dns:
      - 172.28.0.53

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16
