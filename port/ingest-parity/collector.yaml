receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

connectors:
  routing/logs:
    default_pipelines: [logs/out-default]
    error_mode: ignore
    table:
      - context: log
        statement: route() where IsMatch(attributes["rr-web.event"], ".*")
        pipelines: [logs/out-rrweb]

exporters:
  clickhouse:
    endpoint: tcp://ch-server:9000?dial_timeout=10s
    database: parity
    username: parity
    password: parity
    create_schema: true
    timeout: 30s
    ttl: 720h
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  clickhouse/rrweb:
    endpoint: tcp://ch-server:9000?dial_timeout=10s
    database: parity
    username: parity
    password: parity
    create_schema: true
    logs_table_name: hyperdx_sessions
    timeout: 30s
    ttl: 720h
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  otlphttp/couchbase:
    endpoint: http://ingest:4320
    encoding: json
    compression: gzip
    headers:
      Authorization: Bearer 0123456789abcdef0123456789abcdef
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
  otlphttp/couchbase-rrweb:
    endpoint: http://ingest:4320
    encoding: json
    compression: gzip
    headers:
      Authorization: Bearer 0123456789abcdef0123456789abcdef
    logs_endpoint: http://ingest:4320/v1/sessions
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse, otlphttp/couchbase]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse, otlphttp/couchbase]
    logs/in:
      receivers: [otlp]
      processors: [batch]
      exporters: [routing/logs]
    logs/out-default:
      receivers: [routing/logs]
      processors: [batch]
      exporters: [clickhouse, otlphttp/couchbase]
    logs/out-rrweb:
      receivers: [routing/logs]
      processors: [batch]
      exporters: [clickhouse/rrweb, otlphttp/couchbase-rrweb]
