nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.13.0.cjs

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - '@hyperdx/*'
  # Retained UI kit and app telemetry SDKs (not the removed data-layer clients).
  - '@clickhouse/click-ui'
  - '@clickhouse/clickstack-node'
  - '@clickhouse/clickstack-browser'
  # TODO: remove once nx@23.1.1 (published 2026-07-30) is older than the
  # npmMinimalAgeGate window.
  - 'nx'
  - '@nx/*'
