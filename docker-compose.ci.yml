name: hdx-ci

# development only — CI Couchbase credentials
x-cbt-couchbase-env: &cbt-couchbase-env
  CBT_COUCHBASE_CONNSTR: couchbase://couchbase
  CBT_COUCHBASE_BUCKET: otel
  CBT_COUCHBASE_SCOPE: default
  CBT_COUCHBASE_ADMIN_USER: Administrator
  CBT_COUCHBASE_ADMIN_PASSWORD: dev-admin-password
  CBT_COUCHBASE_QUERY_USER: cbt_query
  CBT_COUCHBASE_QUERY_PASSWORD: dev-query-password
  CBT_COUCHBASE_INGEST_USER: cbt_ingest
  CBT_COUCHBASE_INGEST_PASSWORD: dev-ingest-password
  CBT_COUCHBASE_MONITOR_USER: cbt_monitor
  CBT_COUCHBASE_MONITOR_PASSWORD: dev-monitor-password
  CBT_COUCHBASE_RAM_MB: '2048'
  CBT_COUCHBASE_INDEX_RAM_MB: '512'
  CBT_COUCHBASE_SEARCH_RAM_MB: '512'
  # App metadata bucket (MongoDB elimination plan C0); carved from RAM_MB.
  CBT_METADATA_USER: cbt_meta
  CBT_METADATA_PASSWORD: dev-metadata-password
  CBT_METADATA_RAM_MB: '256'

services:
  couchbase:
    image: couchbase/server:enterprise-8.0.3
    mem_limit: 4g
    # Host ports so API/common-utils Jest on the runner can reach the cluster
    # (fixtures + couchbase.*.int.test.ts). Defaults match scripts/slots.sh CI.
    ports:
      - '${CBT_CI_CB_MGMT_PORT:-8091}:8091'
      - '${CBT_CI_CB_VIEW_PORT:-8092}:8092'
      - '${CBT_CI_CB_QUERY_PORT:-8093}:8093'
      - '${CBT_CI_CB_FTS_PORT:-8094}:8094'
      - '${CBT_CI_CB_KV_PORT:-11210}:11210'
    healthcheck:
      test:
        ['CMD', 'curl', '-fs', 'http://localhost:8091/ui/index.html']
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      - internal

  couchbase-init:
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    environment:
      <<: *cbt-couchbase-env
      # Publish alternate address when CI remaps host ports (non-default slots).
      CBT_COUCHBASE_ALT_HOSTNAME: localhost
      CBT_COUCHBASE_ALT_MGMT_PORT: ${CBT_CI_CB_MGMT_PORT:-8091}
      CBT_COUCHBASE_ALT_VIEW_PORT: ${CBT_CI_CB_VIEW_PORT:-8092}
      CBT_COUCHBASE_ALT_QUERY_PORT: ${CBT_CI_CB_QUERY_PORT:-8093}
      CBT_COUCHBASE_ALT_FTS_PORT: ${CBT_CI_CB_FTS_PORT:-8094}
      CBT_COUCHBASE_ALT_KV_PORT: ${CBT_CI_CB_KV_PORT:-11210}
    entrypoint: ['/bin/bash', '/docker/couchbase/init.sh']
    volumes:
      - ./docker/couchbase/init.sh:/docker/couchbase/init.sh:ro
    depends_on:
      couchbase:
        condition: service_healthy
    restart: 'no'
    networks:
      - internal

  ingest:
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    environment:
      <<: *cbt-couchbase-env
      CBT_INGEST_TOKEN: dev-ingest-token-0000000000000000000000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4320/health',{headers:{Authorization:'Bearer '+process.env.CBT_INGEST_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      # Init + first query-plan warm-up can exceed 150s on github runners.
      retries: 60
    depends_on:
      couchbase-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - internal

  otel-collector:
    build:
      context: .
      dockerfile: docker/otel-collector/Dockerfile
      target: dev
      args:
        OTEL_COLLECTOR_VERSION: ${OTEL_COLLECTOR_VERSION}
        OTEL_COLLECTOR_CORE_VERSION: ${OTEL_COLLECTOR_CORE_VERSION}
    environment:
      CBT_INGEST_ENDPOINT: http://ingest:4320
      CBT_INGEST_TOKEN: dev-ingest-token-0000000000000000000000
      CBT_API_KEY: ${CBT_API_KEY}
      CBT_LOG_LEVEL: ${CBT_LOG_LEVEL}
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml
    restart: on-failure
    networks:
      - internal
    depends_on:
      ingest:
        condition: service_healthy

  db:
    image: mongo:5.0.32-focal
    command: --port 29999
    ports:
      - '${CBT_CI_MONGO_PORT:-39999}:29999'
    networks:
      - internal

networks:
  internal: