# Standalone collector config (no OpAMP). Mirrors the Couchbase exporters
# produced by buildOtelCollectorConfig() in opampController.ts.

receivers:
  otlp/cbt:
    protocols:
      grpc:
        include_metadata: true
        endpoint: '0.0.0.0:4317'
      http:
        cors:
          allowed_origins: ['*']
          allowed_headers: ['*']
          max_age: 600
        include_metadata: true
        endpoint: '0.0.0.0:4318'

connectors:
  routing/logs:
    default_pipelines: [logs/out-default]
    error_mode: ignore
    table:
      - context: log
        statement: route() where IsMatch(attributes["rr-web.event"], ".*")
        pipelines: [logs/out-rrweb]

exporters:
  otlphttp/couchbase-rrweb:
    endpoint: ${env:CBT_INGEST_ENDPOINT}
    logs_endpoint: ${env:CBT_INGEST_ENDPOINT}/v1/sessions
    encoding: json
    compression: gzip
    headers:
      Authorization: Bearer ${env:CBT_INGEST_TOKEN}
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
  otlphttp/couchbase:
    endpoint: ${env:CBT_INGEST_ENDPOINT}
    encoding: json
    compression: gzip
    headers:
      Authorization: Bearer ${env:CBT_INGEST_TOKEN}
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

service:
  # Pipeline `processors:` lists live in the base config.yaml so users can
  # swap them via CUSTOM_OTELCOL_CONFIG_FILE.
  pipelines:
    traces:
      receivers: [otlp/cbt]
      exporters: [otlphttp/couchbase]
    metrics:
      receivers: [otlp/cbt]
      exporters: [otlphttp/couchbase]
    logs/in:
      receivers: [otlp/cbt]
      exporters: [routing/logs]
    logs/out-default:
      receivers: [routing/logs]
      exporters: [otlphttp/couchbase]
    logs/out-rrweb:
      receivers: [routing/logs]
      exporters: [otlphttp/couchbase-rrweb]
