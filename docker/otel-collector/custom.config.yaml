receivers:
  hostmetrics:
    collection_interval: 5s
    scrapers:
      cpu:
      load:
      memory:
      disk:
      filesystem:
      network:
# To override the default `memory_limiter` (or any other base processor),
# define a NEW processor with a different name and swap the pipeline
# `processors:` lists to reference it. Leaf-merging into the existing
# `memory_limiter` block does NOT work cleanly because the OTel processor
# silently prefers `limit_mib` over `limit_percentage` when both are set.
# Example: switch to percentage-based memory limiting.
#
# processors:
#   memory_limiter/custom:
#     check_interval: 5s
#     limit_percentage: 75
#     spike_limit_percentage: 25
#
# service:
#   pipelines:
#     traces:
#       processors: [memory_limiter/custom, transform/session_id, batch]
#     metrics:
#       processors: [memory_limiter/custom, batch]
#     logs/out-default:
#       processors: [memory_limiter/custom, transform, transform/session_id, batch]
#     logs/out-rrweb:
#       processors: [memory_limiter/custom, transform/session_id, batch]
#
# Example: tune `batch` for lower-latency exports.
# (See packages/otel-collector/README.md for env-var alternatives.)
#
# processors:
#   batch/lowlatency:
#     send_batch_size: 1000
#     send_batch_max_size: 2000
#     timeout: 500ms
#
# service:
#   pipelines:
#     traces:
#       processors: [memory_limiter, transform/session_id, batch/lowlatency]
#     logs/out-default:
#       processors: [memory_limiter, transform, transform/session_id, batch/lowlatency]
# Extend the collector through OpAMP-managed config. Add optional pipelines here
# only when they do not require removed legacy store or JSON-collector services.
# See packages/otel-collector/README.md for examples.
