receivers:
  hostmetrics:
    collection_interval: 5s
    scrapers:
      cpu:
      load:
      memory:
      disk:
      filesystem:
      network:
exporters:
  logging:
    loglevel: ${env:CBT_LOG_LEVEL}
  otlphttp:
    endpoint: 'http://otel-collector:4318'
    headers:
      authorization: ${CBT_API_KEY}
    compression: gzip
service:
  telemetry:
    logs:
      level: ${env:CBT_LOG_LEVEL}
  pipelines:
    metrics:
      receivers: [hostmetrics]
      exporters: [otlphttp, logging]
