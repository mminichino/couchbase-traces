name: ${CBT_DEV_PROJECT:-hdx-oss-dev}

x-hdx-labels: &hdx-labels
  cbt.dev.slot: '${CBT_DEV_SLOT:-0}'
  cbt.dev.branch: '${CBT_DEV_BRANCH:-unknown}'
  cbt.dev.worktree: '${CBT_DEV_WORKTREE:-unknown}'

# development only — dev Couchbase credentials
x-cbt-couchbase-env: &cbt-couchbase-env
  CBT_COUCHBASE_CONNSTR: couchbase://couchbase
  CBT_COUCHBASE_BUCKET: otel
  CBT_COUCHBASE_SCOPE: default
  CBT_COUCHBASE_ADMIN_USER: Administrator
  CBT_COUCHBASE_ADMIN_PASSWORD: dev-admin-password
  CBT_COUCHBASE_QUERY_USER: cbt_query
  CBT_COUCHBASE_QUERY_PASSWORD: dev-query-password
  CBT_COUCHBASE_INGEST_USER: cbt_ingest
  CBT_COUCHBASE_INGEST_PASSWORD: dev-ingest-password
  CBT_COUCHBASE_MONITOR_USER: cbt_monitor
  CBT_COUCHBASE_MONITOR_PASSWORD: dev-monitor-password
  CBT_COUCHBASE_RAM_MB: '2048'
  CBT_COUCHBASE_INDEX_RAM_MB: '512'
  CBT_COUCHBASE_SEARCH_RAM_MB: '512'
  # App metadata bucket (MongoDB elimination plan C0); carved from RAM_MB.
  CBT_METADATA_USER: cbt_meta
  CBT_METADATA_PASSWORD: dev-metadata-password
  CBT_METADATA_RAM_MB: '256'

services:
  db:
    labels:
      <<: *hdx-labels
      cbt.dev.service: mongodb
      cbt.dev.port: '${CBT_DEV_MONGO_PORT:-27017}'
    image: mongo:5.0.32-focal
    volumes:
      - .volumes/db_dev_${CBT_DEV_SLOT:-0}:/data/db
    ports:
      - '${CBT_DEV_MONGO_PORT:-27017}:27017'
    networks:
      - internal

  couchbase:
    labels:
      <<: *hdx-labels
      cbt.dev.service: couchbase
      cbt.dev.port: '${CBT_DEV_CB_MGMT_PORT:-8091}'
      cbt.dev.url: 'http://localhost:${CBT_DEV_CB_MGMT_PORT:-8091}'
    image: ${COUCHBASE_IMAGE:-couchbase/server:enterprise-8.0.3}
    mem_limit: 4g
    volumes:
      - .volumes/couchbase_dev_${CBT_DEV_SLOT:-0}:/opt/couchbase/var
    ports:
      - '127.0.0.1:${CBT_DEV_CB_MGMT_PORT:-8091}:8091'
      - '127.0.0.1:${CBT_DEV_CB_PORT_8092:-8092}:8092'
      - '127.0.0.1:${CBT_DEV_CB_PORT_8093:-8093}:8093'
      - '127.0.0.1:${CBT_DEV_CB_PORT_8094:-8094}:8094'
      - '127.0.0.1:${CBT_DEV_CB_PORT_8095:-8095}:8095'
      - '127.0.0.1:${CBT_DEV_CB_PORT_8096:-8096}:8096'
      - '127.0.0.1:${CBT_DEV_CB_PORT_8097:-8097}:8097'
      - '127.0.0.1:${CBT_DEV_CB_KV_PORT:-11210}:11210'
    healthcheck:
      test:
        ['CMD', 'curl', '-fs', 'http://localhost:8091/ui/index.html']
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      - internal

  couchbase-init:
    labels:
      <<: *hdx-labels
      cbt.dev.service: couchbase-init
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    image: cbt-ingest-dev:${CBT_DEV_SLOT:-0}
    environment:
      <<: *cbt-couchbase-env
      CBT_COUCHBASE_ALT_HOSTNAME: localhost
      CBT_COUCHBASE_ALT_MGMT_PORT: ${CBT_DEV_CB_MGMT_PORT:-8091}
      CBT_COUCHBASE_ALT_VIEW_PORT: ${CBT_DEV_CB_PORT_8092:-8092}
      CBT_COUCHBASE_ALT_QUERY_PORT: ${CBT_DEV_CB_PORT_8093:-8093}
      CBT_COUCHBASE_ALT_FTS_PORT: ${CBT_DEV_CB_PORT_8094:-8094}
      CBT_COUCHBASE_ALT_KV_PORT: ${CBT_DEV_CB_KV_PORT:-11210}
    entrypoint: ['/bin/bash', '/docker/couchbase/init.sh']
    volumes:
      - ./docker/couchbase/init.sh:/docker/couchbase/init.sh:ro
    depends_on:
      couchbase:
        condition: service_healthy
    restart: 'no'
    networks:
      - internal

  ingest:
    labels:
      <<: *hdx-labels
      cbt.dev.service: ingest
      cbt.dev.port: '${CBT_DEV_INGEST_PORT:-4320}'
      cbt.dev.url: 'http://localhost:${CBT_DEV_INGEST_PORT:-4320}'
    image: cbt-ingest-dev:${CBT_DEV_SLOT:-0}
    environment:
      <<: *cbt-couchbase-env
      CBT_INGEST_TOKEN: dev-ingest-token-0000000000000000000000
      CBT_LOGS_TTL: ${CBT_LOGS_TTL:-720h}
      CBT_TRACES_TTL: ${CBT_TRACES_TTL:-720h}
      CBT_METRICS_TTL: ${CBT_METRICS_TTL:-720h}
      CBT_SESSIONS_TTL: ${CBT_SESSIONS_TTL:-720h}
    ports:
      - '${CBT_DEV_INGEST_PORT:-4320}:4320'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4320/health',{headers:{Authorization:'Bearer '+process.env.CBT_INGEST_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      couchbase-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - internal

  otel-collector:
    labels:
      <<: *hdx-labels
      cbt.dev.service: otel-collector
      cbt.dev.port: '${CBT_DEV_OTEL_HTTP_PORT:-4318}'
      cbt.dev.url: 'http://localhost:${CBT_DEV_OTEL_HTTP_PORT:-4318}'
    build:
      context: .
      dockerfile: docker/otel-collector/Dockerfile
      target: dev
      args:
        OTEL_COLLECTOR_VERSION: ${OTEL_COLLECTOR_VERSION}
        OTEL_COLLECTOR_CORE_VERSION: ${OTEL_COLLECTOR_CORE_VERSION}
    environment:
      CBT_INGEST_ENDPOINT: http://ingest:4320
      CBT_INGEST_TOKEN: dev-ingest-token-0000000000000000000000
      CBT_API_KEY: ${CBT_API_KEY}
      CBT_LOG_LEVEL: ${CBT_LOG_LEVEL}
      OPAMP_SERVER_URL: 'http://host.docker.internal:${CBT_OPAMP_PORT:-4320}'
      OTEL_SUPERVISOR_LOGS: 'true'
      CBT_OTEL_EXPORTER_TABLES_TTL: '24h'
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml
      - ./docker/otel-collector/supervisor_docker.yaml.tmpl:/etc/otel/supervisor.yaml.tmpl
    ports:
      - '${CBT_DEV_OTEL_HEALTH_PORT:-13133}:13133'
      - '${CBT_DEV_OTEL_GRPC_PORT:-4317}:4317'
      - '${CBT_DEV_OTEL_HTTP_PORT:-4318}:4318'
      - '${CBT_DEV_OTEL_METRICS_PORT:-8888}:8888'
    restart: always
    networks:
      - internal
    depends_on:
      ingest:
        condition: service_healthy

  prometheus:
    labels:
      <<: *hdx-labels
      cbt.dev.service: prometheus
      cbt.dev.port: '${CBT_DEV_PROMETHEUS_PORT:-9090}'
      cbt.dev.url: 'http://localhost:${CBT_DEV_PROMETHEUS_PORT:-9090}'
    profiles:
      - prometheus
    image: prom/prometheus:latest
    ports:
      - '${CBT_DEV_PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - .volumes/prometheus_data_dev_${CBT_DEV_SLOT:-0}:/prometheus
    networks:
      - internal
    restart: on-failure

networks:
  internal:
