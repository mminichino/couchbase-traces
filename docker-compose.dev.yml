  #   ports:
  #     - '4040:4040'
  #   volumes:
  #     - ./proxy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
  #     - ./proxy/traefik/config.yml:/etc/traefik/dynamic/config.yml:ro
  #   environment:
  #     CBT_BASE_PATH: ${CBT_BASE_PATH:-/}
  #   network_mode: host
  #   restart: always

  prometheus:
    labels:
      <<: *hdx-labels
      cbt.dev.service: prometheus
      cbt.dev.port: '${CBT_DEV_PROMETHEUS_PORT:-9090}'
      cbt.dev.url: 'http://localhost:${CBT_DEV_PROMETHEUS_PORT:-9090}'
    profiles:
      - prometheus
    image: prom/prometheus:latest
    ports:
      - '${CBT_DEV_PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - .volumes/prometheus_data_dev_${CBT_DEV_SLOT:-0}:/prometheus
    networks:
      - internal
    restart: on-failure

networks:
  internal:
