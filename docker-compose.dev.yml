name: ${CBT_DEV_PROJECT:-hdx-oss-dev}
x-hdx-labels: &hdx-labels
  cbt.dev.slot: '${CBT_DEV_SLOT:-0}'
  cbt.dev.branch: '${CBT_DEV_BRANCH:-unknown}'
  cbt.dev.worktree: '${CBT_DEV_WORKTREE:-unknown}'
services:
  db:
    labels:
      <<: *hdx-labels
      cbt.dev.service: mongodb
      cbt.dev.port: '${CBT_DEV_MONGO_PORT:-27017}'
    image: mongo:5.0.32-focal
    volumes:
      - .volumes/db_dev_${CBT_DEV_SLOT:-0}:/data/db
    ports:
      - '${CBT_DEV_MONGO_PORT:-27017}:27017'
    networks:
      - internal
  otel-collector:
    labels:
      <<: *hdx-labels
      cbt.dev.service: otel-collector
      cbt.dev.port: '${CBT_DEV_OTEL_HTTP_PORT:-4318}'
      cbt.dev.url: 'http://localhost:${CBT_DEV_OTEL_HTTP_PORT:-4318}'
    build:
      context: .
      dockerfile: docker/otel-collector/Dockerfile
      target: dev
      args:
        OTEL_COLLECTOR_VERSION: ${OTEL_COLLECTOR_VERSION}
        OTEL_COLLECTOR_CORE_VERSION: ${OTEL_COLLECTOR_CORE_VERSION}
    environment:
      CLICKHOUSE_ENDPOINT: 'tcp://ch-server:9000?dial_timeout=10s'
      # host:port (plain HTTP), http://host:port or https://host:port
      CLICKHOUSE_PROMETHEUS_METRICS_ENDPOINT: 'ch-server:9363'
      CBT_OTEL_EXPORTER_CLICKHOUSE_DATABASE: ${CBT_OTEL_EXPORTER_CLICKHOUSE_DATABASE}
      CBT_API_KEY: ${CBT_API_KEY}
      CBT_LOG_LEVEL: ${CBT_LOG_LEVEL}
      OPAMP_SERVER_URL: 'http://host.docker.internal:${CBT_OPAMP_PORT:-4320}'
      CUSTOM_OTELCOL_CONFIG_FILE: '/etc/otelcol-contrib/custom.config.yaml'
      # Uncomment to enable stdout logging for the OTel collector
      OTEL_SUPERVISOR_LOGS: 'true'
      CBT_OTEL_EXPORTER_TABLES_TTL: '24h'
      # Optional per-signal overrides; each falls back to CBT_OTEL_EXPORTER_TABLES_TTL:
      #   CBT_OTEL_EXPORTER_LOGS_TTL / _TRACES_TTL / _METRICS_TTL / _SESSIONS_TTL
      # Apply TTL changes to already-existing tables too (default false):
      #   CBT_OTEL_EXPORTER_RECONCILE_TABLE_TTL: 'true'
      ENABLE_PROMQL: 'true'
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml
      - ./docker/otel-collector/supervisor_docker.yaml.tmpl:/etc/otel/supervisor.yaml.tmpl
      # Add a custom config file
      - ./docker/otel-collector/custom.config.yaml:/etc/otelcol-contrib/custom.config.yaml
    ports:
      - '${CBT_DEV_OTEL_HEALTH_PORT:-13133}:13133' # health_check extension
      - '${CBT_DEV_OTEL_GRPC_PORT:-4317}:4317' # OTLP gRPC receiver
      - '${CBT_DEV_OTEL_HTTP_PORT:-4318}:4318' # OTLP http receiver
      - '${CBT_DEV_OTEL_METRICS_PORT:-8888}:8888' # metrics extension
      # Uncomment to enable statsd ingestion (also requires adding the
      # `statsd` receiver to a pipeline in custom.config.yaml - see
      # packages/otel-collector/README.md). Left commented out by default:
      # a fixed host port mapping fails the whole service's startup if
      # something else on the host already owns 8125/udp.
      # - '${CBT_DEV_OTEL_STATSD_PORT:-8125}:8125/udp' # statsd receiver
    restart: always
    networks:
      - internal
    depends_on:
      ch-server:
        condition: service_healthy
  otel-collector-json:
    labels:
      <<: *hdx-labels
      cbt.dev.service: otel-collector-json
      cbt.dev.port: '${CBT_DEV_OTEL_JSON_HTTP_PORT:-14318}'
      cbt.dev.url: 'http://localhost:${CBT_DEV_OTEL_JSON_HTTP_PORT:-14318}'
    build:
      context: .
      dockerfile: docker/otel-collector/Dockerfile
      target: dev
      args:
        OTEL_COLLECTOR_VERSION: ${OTEL_COLLECTOR_VERSION}
        OTEL_COLLECTOR_CORE_VERSION: ${OTEL_COLLECTOR_CORE_VERSION}
    environment:
      CLICKHOUSE_ENDPOINT: 'tcp://ch-server:9000?dial_timeout=10s'
      CLICKHOUSE_PROMETHEUS_METRICS_ENDPOINT: 'ch-server:9363'
      CBT_OTEL_EXPORTER_CLICKHOUSE_DATABASE: 'otel_json'
      CBT_OTEL_EXPORTER_CREATE_LEGACY_SCHEMA: 'true'
      CBT_API_KEY: ${CBT_API_KEY}
      CBT_LOG_LEVEL: ${CBT_LOG_LEVEL}
      OPAMP_SERVER_URL: 'http://host.docker.internal:${CBT_OPAMP_PORT:-4320}'
      CUSTOM_OTELCOL_CONFIG_FILE: '/etc/otelcol-contrib/custom.config.yaml'
      # Uncomment to enable stdout logging for the OTel collector
      OTEL_SUPERVISOR_LOGS: 'true'
      # Enable JSON schema in the ClickHouse exporter (per-exporter config)
      # Be sure to also set BETA_CH_OTEL_JSON_SCHEMA_ENABLED to 'true' in ch-server
      CBT_OTEL_EXPORTER_CLICKHOUSE_JSON_ENABLE: 'true'
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml
      - ./docker/otel-collector/supervisor_docker.yaml.tmpl:/etc/otel/supervisor.yaml.tmpl
    ports:
      - '${CBT_DEV_OTEL_JSON_HTTP_PORT:-14318}:4318' # OTLP http receiver
    restart: always
    networks:
      - internal
    depends_on:
      ch-server:
        condition: service_healthy
  ch-server:
    labels:
      <<: *hdx-labels
      cbt.dev.service: clickhouse
      cbt.dev.port: '${CBT_DEV_CH_HTTP_PORT:-8123}'
      cbt.dev.url: 'http://localhost:${CBT_DEV_CH_HTTP_PORT:-8123}'
    image: clickhouse/clickhouse-server:26.8.36.3-alpine
    ports:
      - '${CBT_DEV_CH_HTTP_PORT:-8123}:8123' # http api
      - '${CBT_DEV_CH_NATIVE_PORT:-9000}:9000' # native
    environment:
      # default settings
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CBT_OTEL_EXPORTER_CLICKHOUSE_DATABASE: ${CBT_OTEL_EXPORTER_CLICKHOUSE_DATABASE}
      # Set to 'true' to allow for proper OTel JSON Schema creation
      # Be sure to also set CBT_OTEL_EXPORTER_CLICKHOUSE_JSON_ENABLE in otel-collector
      # BETA_CH_OTEL_JSON_SCHEMA_ENABLED: 'true'
    volumes:
      - ./docker/clickhouse/local/config.xml:/etc/clickhouse-server/config.xml
      - ./docker/clickhouse/local/users.xml:/etc/clickhouse-server/users.xml
      - .volumes/ch_data_dev_${CBT_DEV_SLOT:-0}:/var/lib/clickhouse
      - .volumes/ch_logs_dev_${CBT_DEV_SLOT:-0}:/var/log/clickhouse-server
    restart: on-failure
    networks:
      - internal
    healthcheck:
      test:
        wget -O /dev/null --no-verbose --tries=1 http://127.0.0.1:8123/ping ||
        exit 1
      interval: 1s
      timeout: 1s
      retries: 60

