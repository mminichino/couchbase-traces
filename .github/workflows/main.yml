name: Main
on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    # Cold every run (no cross-run nx cache, see below): 4m47s-8m06s measured
    # over 25 runs to PR #27, so 8m cancelled at the tail of the distribution.
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so `nx affected` can diff against the PR base ref.
          # Blobless, not treeless: `nx affected` runs `git diff --name-only`,
          # which needs the trees. `tree:0` makes that diff pay a lazy fetch
          # round trip and comes out slower than the bytes it saves.
          fetch-depth: 0
          filter: blob:none
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache-dependency-path: 'yarn.lock'
          cache: 'yarn'
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Install core libs
        run: sudo apt-get install --yes curl bc
      # No cross-run nx cache. Nx 21+ restores only artifacts recorded in its
      # per-machine database (.nx/workspace-data/<machine-id>-v3.db); a fresh
      # runner has none, so every restored .nx/cache entry was rejected
      # ("Unrecognized Cache Artifacts") and every PR ran cold anyway while
      # each push uploaded ~1 GB. Within the job, nx still caches ci:build
      # for the ci:lint tasks that depend on it.
      - name: Run lint + type check (affected)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx nx affected -t ci:lint --base="origin/${BASE_REF}"
      - name: Run lint + type check (full)
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t ci:lint
      # Whole-repo escape-hatch ratchet — runs unconditionally (not via `nx
      # affected`, and not via `make ci-lint`, which this job no longer calls),
      # so the gate can't be silently skipped for a PR that touches few projects.
      - name: Escape-hatch ratchet tests
        run: node --test scripts/ci/__tests__/ratchet.test.mjs
      # Also unconditional, and against the PR's own tree. claude-code-review.yml
      # runs this file too, but from a base-branch checkout, so a PR that breaks
      # what it pins (the AGENTS.md heading every review footer links to) passes
      # there and would fail every later PR's review job instead of its own.
      - name: Review helper tests
        run:
          node --test
          .github/scripts/code-review/__tests__/review-comments.test.mjs
      - name: Escape-hatch ratchet
        run: node scripts/ci/ratchet.mjs
      # Also unconditional: the api's own `ci:lint` regenerates the spec but
      # never asserts on it, and nx can skip or cache-replay that task.
      - name: Check openapi.json is in sync with its sources
        run: scripts/ci/check-openapi-sync.sh
  unit:
    # 8m was marginal: install + build + coverage unit often lands near the
    # ceiling and GitHub marks the job cancelled (not failed) on timeout.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache-dependency-path: 'yarn.lock'
          cache: 'yarn'
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Build dependencies
        run: make ci-build
      - name: Run unit tests
        run: make ci-unit
  integration-shards:
    name: Integration - Shard ${{ matrix.shard }}
    # Sequential bake + prune (ENOSPC mitigation) needs more than the old
    # parallel-bake 16m budget. The golden replay now runs in its own job
    # (parity-goldens), so this covers bake + compose + int tests only.
    timeout-minutes: 55
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Fifth shard (R2c, pre-approved): the MCP suites pushed shard 1 to
        # 48m50s of its 55 minute timeout.
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Startup (R2b PR #42, shard 2): deleting the hosted toolcaches took
      # 2m05. Run it behind node setup and yarn install; the docker step
      # waits for it before the first build.
      - name: Free runner disk (background)
        run: |
          df -h / || true
          nohup bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; \
            touch /tmp/cbt-disk-freed' > /tmp/cbt-disk-free.log 2>&1 &
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache-dependency-path: 'yarn.lock'
          cache: 'yarn'
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4
      # A docker-container builder for the collector only: the default docker
      # driver cannot import or export the GHA layer cache. `use: false`
      # keeps `docker compose build` on the default driver, so the 4.7 GB
      # ingest image is not copied out of a builder container.
      - name: Set up buildx (collector cache)
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          use: false
      - name: Spin up docker services
        env:
          CBT_BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          # One writer: every shard compiles the same collector, and five
          # concurrent uploads of one cache scope only race.
          CBT_COLLECTOR_CACHE_TO:
            ${{ matrix.shard == 1 &&
            'type=gha,mode=max,scope=ci-otel-collector,ignore-error=true' || ''
            }}
        run: |
          # Parallel builds of ingest (yarn) + otel (Go) fill the runner disk
          # (ENOSPC): prune Docker and build one target at a time.
          for _ in $(seq 1 120); do
            [ -f /tmp/cbt-disk-freed ] && break
            sleep 5
          done
          cat /tmp/cbt-disk-free.log || true
          docker builder prune -af || true
          docker system prune -af --volumes || true
          df -h / || true
          export BUILDKIT_MAX_PARALLELISM=1
          # Compose build (not bake) for ingest: bake --load + a later plain
          # `compose up` often rebuilt anyway and left ingest unhealthy.
          # `up --no-build` uses the project tags (hdx-ci-<service>).
          docker compose -f ./docker-compose.ci.yml pull couchbase
          # couchbase-init and ingest are one build (same context and
          # Dockerfile, no target or args): build once, tag for both.
          echo "Building ingest (also couchbase-init)..."
          docker compose -f ./docker-compose.ci.yml build ingest
          docker tag hdx-ci-ingest:latest hdx-ci-couchbase-init:latest
          docker builder prune -af || true
          df -h / || true
          # The OCB compile was 11m33 of shard 2's startup. The GHA layer
          # cache skips it while builder-config.yaml, the Dockerfile, the
          # version args and the base images are unchanged. Bake reads the
          # build definition (and the .env args) from the compose file.
          echo "Building otel-collector..."
          set -- --set otel-collector.tags=hdx-ci-otel-collector \
            --set otel-collector.cache-from=type=gha,scope=ci-otel-collector
          if [ -n "$CBT_COLLECTOR_CACHE_TO" ]; then
            set -- "$@" --set "otel-collector.cache-to=$CBT_COLLECTOR_CACHE_TO"
          fi
          docker buildx bake --builder "$CBT_BUILDX_BUILDER" \
            -f ./docker-compose.ci.yml otel-collector --load "$@"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^hdx-ci-' || true
          df -h / || true
      - name: Build dependencies
        run: make ci-build
      # Integration tests boot a MockServer on fixed ports and share a single
      # metadata bucket, so they must stay serial (--runInBand)
      # within a runner. We shard ACROSS runners instead: each shard is its own
      # VM with its own Docker stack, and jest's --shard splits the test files
      # so the shards run in parallel.
      #
      # Jest is invoked per package rather than through `nx run-many`: nx's
      # streamed output prefixes every pipe chunk as its own line, splitting
      # Jest's stack traces and ANSI codes mid-line. Both packages always run
      # so one failure doesn't hide the other.
      #
      # Runs inline (not `make ci-int`) so the compose project stays `hdx-ci`
      # (matching the build step above); make ci-int's `-p int-<slot>` is local
      # multi-worktree isolation that CI doesn't need. Teardown and
      # log-archival are omitted intentionally — the runner is ephemeral and
      # Actions streams stdout.
      - name: Run integration tests
        env:
          # FixtureDataClient (api int) talks to the CI compose cluster.
          # Leave CBT_TEST_COUCHBASE_* unset so *.couchbase.int.test.ts skip
          # here (they need the `test` bucket from port/couchbase-test).
          CBT_COUCHBASE_CONNSTR: couchbase://127.0.0.1
          CBT_COUCHBASE_BUCKET: otel
          CBT_COUCHBASE_SCOPE: default
          CBT_COUCHBASE_ADMIN_USER: Administrator
          CBT_COUCHBASE_ADMIN_PASSWORD: dev-admin-password
          CBT_COUCHBASE_QUERY_USER: cbt_query
          CBT_COUCHBASE_QUERY_PASSWORD: dev-query-password
          CBT_TEST_COUCHBASE_REQUIRED: '0'
        run: |
          set +e
          docker compose -f ./docker-compose.ci.yml up -d --no-build --pull missing
          up_status=$?
          if [ "$up_status" -ne 0 ]; then
            echo "::error::compose up failed ($up_status); dumping service logs"
            docker compose -f ./docker-compose.ci.yml ps -a || true
            docker compose -f ./docker-compose.ci.yml logs --no-color --tail=200 \
              couchbase couchbase-init ingest otel-collector || true
            exit "$up_status"
          fi
          status=0
          yarn workspace @couchbase-traces/common-utils ci:int --shard=${{ matrix.shard }}/${{ strategy.job-total }} || status=1
          yarn workspace @couchbase-traces/api ci:int --shard=${{ matrix.shard }}/${{ strategy.job-total }} || status=1
          exit $status
  # Own job (R2a): on shard 1 the replay ran after the int tests and pushed the
  # shard past its timeout. The replay brings up its own compose project, so
  # it needs none of the shard's stack.
  parity-goldens:
    name: Parity goldens
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache-dependency-path: 'yarn.lock'
          cache: 'yarn'
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / || true
      - name: Build dependencies
        run: make ci-build
      - name: Replay parity goldens
        run: GOLDEN_SKIP_GATE=1 bash port/golden/run.sh --suite ingest
  # Stable aggregator context: `integration` is green only when all five shards
  # and the golden replay pass. Merge-queue / required-status checks target this
  # single context, since the per-shard contexts (Integration - Shard N) are not
  # stable check names.
  integration:
    needs: [integration-shards, parity-goldens]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all integration shards passed
        if: needs.integration-shards.result != 'success'
        run: |
          echo "::error::One or more integration shards failed"
          exit 1
      - name: Verify parity goldens passed
        if: needs.parity-goldens.result != 'success'
        run: |
          echo "::error::Parity golden replay failed"
          exit 1
  # D34: v1.0.0's compiled CLI binaries crashed on every command and nothing ran
  # them. Build all three with the pinned Bun; run the Linux one.
  cli-binaries:
    name: CLI binaries
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache-dependency-path: 'yarn.lock'
          cache: 'yarn'
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Build and run the CLI binaries
        run: make cli-binaries-check
  otel-unit-test:
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            packages/otel-collector/**
      - name: Setup Go
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/otel-collector/go.mod
          cache-dependency-path: packages/otel-collector/go.sum
      - name: Verify Go module
        if: steps.changed-files.outputs.any_changed == 'true'
        working-directory: ./packages/otel-collector
        run: go mod verify
  couchbase-integration:
    name: Couchbase integration
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache-dependency-path: 'yarn.lock'
          cache: 'yarn'
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Build dependencies
        run: make ci-build
      - name: Run Couchbase integration harness
        run: port/couchbase-test/run.sh
  stack-smoke:
    name: Product stack smoke
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            docker/**
            packages/ingest/**
            packages/otel-collector/**
            port/stack-smoke/**
            Makefile
            docker-compose*.yml
            .env.example
            .github/workflows/main.yml
      - name: Skip when paths unchanged on PR
        if:
          github.event_name == 'pull_request' &&
          steps.changed-files.outputs.any_changed != 'true'
        run: echo "No stack-smoke inputs changed; skipping."
      - name: Setup node
        if:
          github.event_name == 'push' || steps.changed-files.outputs.any_changed
          == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache-dependency-path: 'yarn.lock'
          cache: 'yarn'
      - name: Install root dependencies
        if:
          github.event_name == 'push' || steps.changed-files.outputs.any_changed
          == 'true'
        run: yarn install --immutable
      - name: Run stack smoke
        if:
          github.event_name == 'push' || steps.changed-files.outputs.any_changed
          == 'true'
        env:
          CBT_STACK_SMOKE_PRUNE: '1'
          BUILDKIT_MAX_PARALLELISM: '1'
        run: bash port/stack-smoke/run.sh
  # Playwright full-stack E2E on the Couchbase stack (R5; re-enabled after R4).
  # The report job is the required `End-to-End Tests` check and fails when any
  # shard fails or is cancelled.
  e2e-tests:
    uses: ./.github/workflows/e2e-tests.yml
    permissions:
      contents: read

  e2e-report:
    name: End-to-End Tests
    if: always()
    needs: e2e-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: all-test-results

      - name: Aggregate test results
        id: test-results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const path = require('path');

            let totalPassed = 0;
            let totalFailed = 0;
            let totalFlaky = 0;
            let totalSkipped = 0;
            let totalDuration = 0;
            let foundResults = false;

            try {
              const resultsDir = 'all-test-results';
              const shards = fs.readdirSync(resultsDir);

              for (const shard of shards) {
                const resultsPath = path.join(resultsDir, shard, 'results.json');
                if (fs.existsSync(resultsPath)) {
                  foundResults = true;
                  const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                  const { stats } = results;

                  totalPassed += stats.expected || 0;
                  totalFailed += stats.unexpected || 0;
                  totalFlaky += stats.flaky || 0;
                  totalSkipped += stats.skipped || 0;
                  totalDuration += stats.duration || 0;
                }
              }

              if (foundResults) {
                const duration = Math.round(totalDuration / 1000);
                const summary = totalFailed > 0
                  ? `❌ **${totalFailed} test${totalFailed > 1 ? 's' : ''} failed**`
                  : `✅ **All tests passed**`;

                return `## E2E Test Results

            ${summary} • ${totalPassed} passed • ${totalSkipped} skipped • ${duration}s

            | Status | Count |
            |--------|-------|
            | ✅ Passed | ${totalPassed} |
            | ❌ Failed | ${totalFailed} |
            | ⚠️ Flaky | ${totalFlaky} |
            | ⏭️ Skipped | ${totalSkipped} |

            Tests ran across ${shards.length} shards in parallel.

            [View full report →](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              } else {
                return `## E2E Test Results

            ❌ **Test results file not found**

            [View full report →](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              }
            } catch (error) {
              console.log('Could not parse test results:', error.message);
              return `## E2E Test Results

            ❌ **Error reading test results**: ${error.message}

            [View full report →](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            }

      - name: Comment PR with test results
        uses: mshick/add-pr-comment@v3
        # Skip for fork PRs: GITHUB_TOKEN cannot write to the base repo
        if:
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork != true
        with:
          message: ${{ steps.test-results.outputs.result }}
          message-id: e2e-test-results

      - name: Check test results
        id: check-results
        run: |
          total_failed=0
          for dir in all-test-results/*/; do
            if [ -f "${dir}results.json" ]; then
              unexpected=$(jq -r '.stats.unexpected // 0' "${dir}results.json")
              total_failed=$((total_failed + unexpected))
            fi
          done
          if [ "$total_failed" -gt 0 ]; then
            echo "::error::$total_failed E2E test(s) failed"
            exit 1
          fi
          # Fail when any shard failed or was cancelled (timeout) even if we
          # couldn't read failure count from artifacts. Cancelled used to leave
          # this aggregator green while the Main workflow conclusion stayed
          # cancelled — which blocks acceptance K2 (requires success).
          if [ "${{ needs.e2e-tests.result }}" = "failure" ] || [ "${{ needs.e2e-tests.result }}" = "cancelled" ]; then
            echo "::error::One or more E2E test shards ${{ needs.e2e-tests.result }}"
            exit 1
          fi
