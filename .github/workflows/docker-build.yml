name: Docker Build
# Verifies the release Docker images actually build, without pushing.
# A source-level type check (`make ci-lint`) cannot catch build failures that
# only surface inside the image — e.g. a declaration file that exists in the
# repo but was never COPYed into the Docker build stage.
#
# On pull requests each image is built only when files that affect it change,
# so unrelated PRs stay fast.
#
# On pushes to main every image is built regardless of what changed. The path
# filter is the wrong instrument there, because these builds can break with no
# repo change at all: the Dockerfile pins floating upstream tags
# (`node:${NODE_VERSION}-alpine`, `evalstore-server:${EVAL_STORE_VERSION}-alpine`)
# and the registry re-points them whenever upstream publishes a patch. That is
# exactly how the 26.8-alpine break reached a release: the tag moved from
# legacy store 26.8.6 to 26.8.7 mid-afternoon, upgrading apk-tools 3.0.6 -> 3.0.8
# underneath us. The PR check and the nightly had both already passed against
# the older digest, two commits then merged to main with no image build between
# them, and the failure only appeared in the release run hours later. Building
# unconditionally on main turns that into a red build on the next merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  # Keyed on the event as well as the ref to separate a manual run on main from
  # a merge: both carry `refs/heads/main`, so they would otherwise contend for
  # one group. (A pull request run never collides with either — its ref is
  # `refs/pull/<n>/merge`.)
  #
  # Pushes to main do not cancel in progress, so a merge cannot kill the build
  # verifying the commit before it. This guarantees the tip of main gets built,
  # not that every individual commit does: GitHub holds only one pending run per
  # group, so a third merge arriving during a long build supersedes the queued
  # one. That is fine for what this job is for — an upstream base-image move
  # affects every commit equally, and a Dockerfile break in a superseded commit
  # is still present at the tip. Per-commit attribution comes from the pull
  # request run, not from here.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # OTel Collector image (Go build via OCB) — docker/otel-collector/Dockerfile.
  otel-collector-image:
    name: Build OTel Collector Image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker builder prune -af || true
          docker system prune -af --volumes || true
          df -h /
      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            docker/otel-collector/**
            packages/otel-collector/**
      - name: Setup Docker Buildx
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.BUILDKIT_MAX_PARALLELISM=1
      - name: Build (no push)
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/otel-collector/Dockerfile
          target: prod
          platforms: linux/amd64
          push: false
          build-args: |
            CODE_VERSION=pr-${{ github.event.pull_request.number || github.run_id }}
            GIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=otel-collector-nightly-amd64
            type=gha,scope=docker-build-pr-otel-collector
          cache-to: type=gha,mode=max,scope=docker-build-pr-otel-collector

  # App/prod image (API + App + common-utils Node build) — docker/hyperdx target prod.
  # This is the image the nightly css.d.ts failure surfaced in; the same builder
  # stage backs the all-in-one targets below.
  app-image:
    name: Build App Image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker builder prune -af || true
          docker system prune -af --volumes || true
          df -h /
      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            packages/api/**
            packages/app/**
            packages/common-utils/**
            docker/hyperdx/**
            package.json
            yarn.lock
            .yarn/**
            .yarnrc.yml
            .prettierrc
            .prettierignore
            tsconfig.base.json
            nx.json
      - name: Setup Docker Buildx
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.BUILDKIT_MAX_PARALLELISM=1
      - name: Build (no push)
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/hyperdx/Dockerfile
          target: prod
          platforms: linux/amd64
          push: false
          build-contexts: |
            hyperdx=./docker/hyperdx
            api=./packages/api
            app=./packages/app
          build-args: |
            CODE_VERSION=pr-${{ github.event.pull_request.number || github.run_id }}
            GIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=app-nightly-amd64
            type=gha,scope=docker-build-pr-app
          cache-to: type=gha,mode=max,scope=docker-build-pr-app

  # Ingest image (OTLP ingest service) — packages/ingest/Dockerfile.
  ingest-image:
    name: Build Ingest Image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            packages/ingest/**
            packages/common-utils/**
            package.json
            yarn.lock
            .yarn/**
            .yarnrc.yml
            tsconfig.base.json
            scripts/ci/check-image-labels.sh
      - name: Setup Docker Buildx
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/ingest/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: couchbase-traces-ingest-check:pr
          build-args: |
            CODE_VERSION=pr-${{ github.event.pull_request.number || github.run_id }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-build-pr-ingest
          cache-to: type=gha,mode=max,scope=docker-build-pr-ingest
      - name: Check version labels
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        env:
          EXPECTED_VERSION:
            pr-${{ github.event.pull_request.number || github.run_id }}
        run:
          scripts/ci/check-image-labels.sh couchbase-traces-ingest-check:pr
          "$EXPECTED_VERSION" "$GITHUB_SHA"

  # All-in-one image (Couchbase Server + ingest + OTel Collector).
  all-in-one-image:
    name: Build All-in-One Image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker builder prune -af || true
          docker system prune -af --volumes || true
          df -h /
      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            packages/otel-collector/**
            packages/ingest/**
            docker/hyperdx/**
            docker/couchbase/**
            docker/otel-collector/**
            scripts/ci/check-image-labels.sh
      - name: Setup Docker Buildx
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.BUILDKIT_MAX_PARALLELISM=1
      - name: Build all-in-one-auth (no push)
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/hyperdx/Dockerfile
          target: all-in-one-auth
          platforms: linux/amd64
          push: false
          load: true
          tags: couchbase-traces-aio-smoke:pr
          build-contexts: |
            otel-collector=./docker/otel-collector
            hyperdx=./docker/hyperdx
            api=./packages/api
            app=./packages/app
          build-args: |
            CODE_VERSION=pr-${{ github.event.pull_request.number || github.run_id }}
            GIT_SHA=${{ github.sha }}
            COUCHBASE_IMAGE=couchbase/server:enterprise-8.0.3
          cache-from: |
            type=gha,scope=all-in-one-nightly-amd64
            type=gha,scope=docker-build-pr-all-in-one
          cache-to: type=gha,mode=max,scope=docker-build-pr-all-in-one
      - name: Check version labels
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        env:
          EXPECTED_VERSION:
            pr-${{ github.event.pull_request.number || github.run_id }}
        run:
          scripts/ci/check-image-labels.sh couchbase-traces-aio-smoke:pr
          "$EXPECTED_VERSION" "$GITHUB_SHA"
      - name: Smoke test the built image
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        timeout-minutes: 25
        run: scripts/ci/smoke-all-in-one.sh couchbase-traces-aio-smoke:pr

  # D33: v1.0.0's release build failed only when both platforms built at once
  # (a shared yarn cache mount). Run the release build pass for every release
  # image on amd64 and arm64 (QEMU), pushing nothing. No layer cache: a cached
  # install layer would skip exactly the step that broke.
  release-images-multiarch:
    name: Build Release Images (amd64 + arm64)
    runs-on: ubuntu-24.04
    # PR #54 took ~92 min (arm64 under QEMU, no layer cache); P15 speeds it up.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af --volumes || true
          df -h /
      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            docker/hyperdx/**
            docker/otel-collector/**
            packages/api/**
            packages/app/**
            packages/common-utils/**
            packages/ingest/**
            packages/otel-collector/**
            package.json
            yarn.lock
            .yarn/**
            .yarnrc.yml
            scripts/release/**
      - name: Setup QEMU
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Setup Docker Buildx
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build (cache only, no push)
        if:
          github.event_name != 'pull_request' ||
          steps.changed-files.outputs.any_changed == 'true'
        run: make release-images-check
